# ONLYOFFICE Workspace – corrected
# Secrets live in .env (see .env.example). ${VAR:?msg} makes Compose stop
# with an error if a variable is missing, instead of silently using a default.
#
# TODO: update all image tags to the versions in ONLYOFFICE's current
#       official compose file before deploying.

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  onlyoffice-mysql-server:
    <<: *common
    container_name: onlyoffice-mysql-server
    image: mysql:8.0.29   # TODO: outdated (MySQL 8.0 is EOL), check supported version
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    networks:
      - onlyoffice
    volumes:
      - ./config/mysql/conf.d:/etc/mysql/conf.d
      # The init script here creates the ONLYOFFICE database user.
      # Its username/password MUST match ONLYOFFICE_DB_USER / ONLYOFFICE_DB_PASSWORD.
      # Init scripts only run once, on an EMPTY mysql_data volume.
      - ./config/mysql/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

  onlyoffice-community-server:
    <<: *common
    container_name: onlyoffice-community-server
    image: onlyoffice/communityserver:12.6.0.1900   # TODO: check current version
    depends_on:
      - onlyoffice-mysql-server
      - onlyoffice-document-server
      - onlyoffice-elasticsearch
    environment:
      - ONLYOFFICE_CORE_MACHINEKEY=${ONLYOFFICE_MACHINEKEY:?set ONLYOFFICE_MACHINEKEY in .env}
      - CONTROL_PANEL_PORT_80_TCP=80
      - CONTROL_PANEL_PORT_80_TCP_ADDR=onlyoffice-control-panel
      - DOCUMENT_SERVER_PORT_80_TCP_ADDR=onlyoffice-document-server
      - DOCUMENT_SERVER_JWT_ENABLED=true
      - DOCUMENT_SERVER_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET in .env}
      - DOCUMENT_SERVER_JWT_HEADER=AuthorizationJwt
      # Must be the SAME value as the MySQL root password above
      - MYSQL_SERVER_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_SERVER_DB_NAME=onlyoffice
      - MYSQL_SERVER_HOST=onlyoffice-mysql-server
      - MYSQL_SERVER_USER=${ONLYOFFICE_DB_USER:?set ONLYOFFICE_DB_USER in .env}
      - MYSQL_SERVER_PASS=${ONLYOFFICE_DB_PASSWORD:?set ONLYOFFICE_DB_PASSWORD in .env}
      - ELASTICSEARCH_SERVER_HOST=onlyoffice-elasticsearch
      - ELASTICSEARCH_SERVER_HTTPPORT=9200
    networks:
      - onlyoffice
    ports:
      # One internal HTTP port; Pangolin handles HTTPS in front of it.
      - "8085:80"
      # - "5222:5222"   # XMPP chat – only if you use external chat clients. Never expose publicly.
    # Required by this image (it runs its own init system inside).
    # Grants near-root access to the host and may not work in an unprivileged LXC.
    privileged: true
    cgroup: host
    volumes:
      - community_data:/var/www/onlyoffice/Data
      - community_log:/var/log/onlyoffice
      - document_data:/var/www/onlyoffice/DocumentServerData
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./certs:/var/www/onlyoffice/Data/certs
      # - community_letsencrypt:/etc/letsencrypt   # not needed when Pangolin does TLS

  onlyoffice-elasticsearch:
    <<: *common
    image: onlyoffice/elasticsearch:7.16.3   # TODO: check current version
    container_name: onlyoffice-elasticsearch
    environment:
      - discovery.type=single-node
      # Often fails inside an LXC ("memory is not locked") – set to false if ES won't start
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g -Dlog4j2.formatMsgNoLookups=true"
      - "indices.fielddata.cache.size=30%"
      - "indices.memory.index_buffer_size=30%"
      - "ingest.geoip.downloader.enabled=false"
    networks:
      - onlyoffice
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - es_data:/usr/share/elasticsearch/data

  onlyoffice-document-server:
    <<: *common
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:8.1   # TODO: outdated, check current version
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}   # must match the community server
      - JWT_HEADER=AuthorizationJwt
    networks:
      - onlyoffice
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice
      - ./document_fonts:/usr/share/fonts/truetype/custom
      - document_forgotten:/var/lib/onlyoffice/documentserver/App_Data/cache/files/forgotten

  # Optional. Only keep it if you use its GUI (SSL, LDAP, SSO, backups).
  # The docker.sock mount gives it full control over Docker on this machine.
  onlyoffice-control-panel:
    <<: *common
    container_name: onlyoffice-control-panel
    depends_on:
      - onlyoffice-document-server
      - onlyoffice-community-server
    image: onlyoffice/controlpanel:3.5.2.530   # TODO: check current version
    environment:
      - ONLYOFFICE_CORE_MACHINEKEY=${ONLYOFFICE_MACHINEKEY}   # must match the community server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - controlpanel_data:/var/www/onlyoffice/Data
      - controlpanel_log:/var/log/onlyoffice
    networks:
      - onlyoffice

networks:
  onlyoffice:
    driver: bridge

volumes:
  document_data:
  document_log:
  document_forgotten:
  community_data:
  community_log:
  community_letsencrypt:
  controlpanel_data:
  controlpanel_log:
  mysql_data:
  es_data:
